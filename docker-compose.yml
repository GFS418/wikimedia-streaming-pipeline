# Local Kafka (single-node KRaft) + Confluent Schema Registry.
#
#   docker compose up -d        # start
#   docker compose down         # stop, keep data (offsets survive for replay drills)
#   docker compose down -v      # stop and wipe the broker volume
#
# Host clients use localhost:9092; containers use kafka:29092.
# Topics are created explicitly by scripts (auto-create is off), so partition
# counts, keys and retention are deliberate decisions, not accidents of a typo.

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: wikistream-kafka
    stop_grace_period: 60s
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: U19oZiXBTPqzwPoOTq5sxw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    container_name: wikistream-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Default compatibility level is a Phase 1 decision; set per subject, not here.
    healthcheck:
      # The 8.x image ships without curl/wget; python3 is present.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- the capture (decision D23). Started only with the profile:
  #   docker compose --profile capture up -d --build      start (or resume after a stop)
  #   docker compose --profile capture stop               stop cleanly (flush, then exit)
  #   docker compose logs -f producer consumer            follow
  # Survives app relaunches and closed terminals; restarts after a crash or a Docker restart.
  producer:
    profiles: ["capture"]
    build: .
    image: wikistream-app:local
    container_name: wikistream-producer
    # Unattended policy: always catch up after downtime, within Wikimedia's 7-day history.
    command: ["wikistream-producer", "--catch-up", "--max-cursor-age-minutes", "10080"]
    environment:
      WIKISTREAM_BOOTSTRAP: kafka:29092
      WIKISTREAM_SCHEMA_REGISTRY: http://schema-registry:8081
    depends_on:
      kafka: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 60s
    logging: &capture-logging
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

  consumer:
    profiles: ["capture"]
    image: wikistream-app:local
    container_name: wikistream-consumer
    command: ["wikistream-consumer"]
    environment:
      WIKISTREAM_BOOTSTRAP: kafka:29092
      WIKISTREAM_SCHEMA_REGISTRY: http://schema-registry:8081
      WIKISTREAM_AWS_PROFILE: wikistream-consumer  # upload-only role (D12), assumed in-container
    volumes:
      # Read-only: the source profile used to assume the role. Never baked into the image.
      - ${HOME}/.aws:/home/app/.aws:ro
    depends_on:
      producer: {condition: service_started}
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *capture-logging

volumes:
  kafka-data:
