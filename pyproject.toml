[project]
name = "wikimedia-streaming-pipeline"
version = "0.1.0"
description = "Streaming pipeline over live Wikimedia edits: Kafka + schema registry, S3 landing, Databricks Delta bronze/silver/gold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.15,<3",
    "httpx>=0.27",
    "boto3>=1.35",
]

[project.scripts]
wikistream-producer = "wikistream.producer:main"
wikistream-consumer = "wikistream.consumer:main"

[dependency-groups]
dev = [
    "moto[s3]>=5",
    "pyspark>=4.1,<4.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikistream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Lakeflow pipeline root is on sys.path in Databricks; mirror that locally.
pythonpath = ["pipeline"]
addopts = "-ra"
markers = ["integration: needs the local Kafka + Schema Registry stack (docker compose up)"]
filterwarnings = ["ignore:The httpx module is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated from the .avsc; guarded by tests/test_lake_schema.py, so tools must not reformat it.
extend-exclude = ["pipeline/wikistream_lake/landing_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark/dbutils are injected globals; cells import mid-file.
"databricks/*.py" = ["F821", "E402"]
# Lakeflow pipeline sources: `spark` is injected by the pipeline runtime.
"pipeline/transformations/*.py" = ["F821"]
